<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo verde esmeralda com cantos arredondados -->
  <rect width="64" height="64" rx="14" fill="#059669"/>
  <!-- Solo sutil -->
  <path d="M6 54h52" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Corpo do trator verde escuro/médio -->
  <path d="M18 36h18v6H18z" fill="#047857"/>
  
  <!-- Cabine do trator com vidro claro -->
  <path d="M22 20h14v16H22z" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Volante / silhueta interna -->
  <path d="M29 27l4 4" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Capô e motor do trator -->
  <path d="M36 28h13a3 3 0 0 1 3 3v11H36V28z" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Escapamento clássico -->
  <path d="M44 19v9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44 19c0-2 2-2 3-1" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Farol dianteiro luminoso -->
  <circle cx="51" cy="34" r="2.5" fill="#FDE047"/>
  
  <!-- Roda traseira grande (trator) -->
  <circle cx="20" cy="42" r="10.5" fill="#18181B" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="20" cy="42" r="6" fill="#3F3F46"/>
  <circle cx="20" cy="42" r="2.5" fill="#F4F4F5"/>
  
  <!-- Garras/pneus da roda traseira -->
  <line x1="20" y1="32" x2="20" y2="35" stroke="#71717A" stroke-width="2"/>
  <line x1="20" y1="49" x2="20" y2="52" stroke="#71717A" stroke-width="2"/>
  <line x1="10" y1="42" x2="13" y2="42" stroke="#71717A" stroke-width="2"/>
  <line x1="27" y1="42" x2="30" y2="42" stroke="#71717A" stroke-width="2"/>
  
  <!-- Roda dianteira menor -->
  <circle cx="48" cy="46" r="6.5" fill="#18181B" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="48" cy="46" r="3.5" fill="#3F3F46"/>
  <circle cx="48" cy="46" r="1.5" fill="#F4F4F5"/>
</svg>
